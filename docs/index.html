<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edvards Markuss Selikovs</title>
  <meta name="description" content="Portfolio of Edvards Markuss Selikovs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --line: #e8e8e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }
    .stage {
      position: relative;
      height: 100vh;
      height: 100svh;
      cursor: grab;
      touch-action: pan-y;
    }
    .stage:active { cursor: grabbing; }
    .stage canvas { display: block; width: 100%; height: 100%; outline: none; }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--muted);
      transition: opacity .4s;
      pointer-events: none;
    }
    .intro { padding: 0 8vw 0 2vw; }
    h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: clamp(48px, 6.4vw, 104px);
      line-height: .95;
      letter-spacing: -.01em;
    }
    h1 span { display: block; }
    .links {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }
    .links a {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      transition: background .2s, color .2s, transform .2s;
    }
    .links a:hover, .links a:focus-visible {
      background: var(--ink);
      color: var(--bg);
      transform: translateY(-2px);
      outline: none;
    }
    .links svg { width: 20px; height: 20px; fill: currentColor; }

    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; align-content: start; }
      .stage { height: 62svh; }
      .intro { padding: 8px 16px 64px; text-align: center; }
      .links { justify-content: center; margin-top: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="stage" aria-label="3D model of a kitten, drag to rotate">
      <div class="loading" id="loading">Loading…</div>
    </div>

    <section class="intro">
      <h1><span>Edvards</span><span>Markuss</span><span>Selikovs</span></h1>
      <nav class="links" aria-label="Profiles">
        <a href="https://github.com/eedvardss" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/emselikovs/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
        </a>
      </nav>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const stage = document.getElementById('stage');
    const loading = document.getElementById('loading');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0.2, 5.2);

    // Texture already carries the photo's lighting, so keep scene lighting soft and even.
    scene.add(new THREE.HemisphereLight(0xffffff, 0xf2ece4, 2.4));
    // Key light rides with the camera, so whichever side faces the viewer is lit like the photo.
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(1.5, 2, 3);
    camera.add(key);
    scene.add(camera);

    // Soft contact shadow under the feet
    const shadowTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, 'rgba(0,0,0,0.22)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(1.4, 1.4),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -1.0;
    scene.add(shadow);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minPolarAngle = Math.PI * 0.32;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;
    controls.target.set(0, 0, 0);

    let resumeTimer;
    controls.addEventListener('start', () => {
      controls.autoRotate = false;
      clearTimeout(resumeTimer);
    });
    controls.addEventListener('end', () => {
      resumeTimer = setTimeout(() => (controls.autoRotate = true), 3000);
    });

    const loader = new GLTFLoader();
    let cat = null;
    loader.load('assets/cat.glb?v=3', (gltf) => {
      cat = gltf.scene;
      cat.traverse((o) => {
        if (o.isMesh && o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      });
      scene.add(cat);
      loading.style.opacity = 0;
    }, undefined, () => { loading.textContent = 'Could not load the model.'; });

    // Sunglasses: already fitted to the cat's eyes in the GLB, toggled by clicking the cat.
    // Only the glasses get a reflection map, so the cat keeps its photo lighting.
    // A dark studio with a few softboxes: black acetate stays deep black and only
    // picks up crisp highlights, the way product shots of Ray-Bans look.
    const studio = new THREE.Scene();
    studio.background = new THREE.Color(0x0b0b0c);
    const softbox = (w, h, intensity, pos) => {
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(intensity, intensity, intensity), side: THREE.DoubleSide }));
      panel.position.set(...pos);
      panel.lookAt(0, 0, 0);
      studio.add(panel);
    };
    softbox(6, 1.4, 6, [0, 6, 4]);     // long strip overhead-front
    softbox(1.6, 5, 3.5, [-6, 1, 3]);  // tall strip left
    softbox(1.6, 5, 2.5, [6, 0, 2]);   // tall strip right
    softbox(5, 5, 0.5, [0, -2, 8]);    // faint fill from the viewer
    const envMap = new THREE.PMREMGenerator(renderer).fromScene(studio, 0.02).texture;
    const glasses = new THREE.Group();
    glasses.visible = false;
    scene.add(glasses);
    const glassesMaterials = [];
    loader.load('assets/glasses.glb?v=3', (gltf) => {
      // Polished black acetate (deep black under a glossy clear coat) and dark G-15 glass.
      const physical = {
        frame: () => new THREE.MeshPhysicalMaterial({
          color: 0x020203, roughness: 0.4, clearcoat: 1, clearcoatRoughness: 0.04,
          envMapIntensity: 1.1,
        }),
        lens: () => new THREE.MeshPhysicalMaterial({
          color: 0x0a120b, roughness: 0.03, ior: 1.5, specularIntensity: 1,
          transparent: true, opacity: 0.94, side: THREE.DoubleSide, envMapIntensity: 1.6,
        }),
      };
      const made = {};
      gltf.scene.traverse((o) => {
        if (!o.isMesh) return;
        const name = o.material.name;
        if (physical[name]) o.material = made[name] ??= Object.assign(physical[name](), { name });
        const m = o.material;
        m.envMap = envMap;
        m.userData.baseOpacity = m.opacity;
        if (!glassesMaterials.includes(m)) glassesMaterials.push(m);
      });
      glasses.add(gltf.scene);
    });

    let glassesOn = false;
    let glassesT = 0; // 0 = hidden above the head, 1 = sitting on the eyes
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downAt = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!downAt || !cat || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
      const r = renderer.domElement.getBoundingClientRect();
      pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.intersectObjects([cat, glasses], true).length) glassesOn = !glassesOn;
    });

    function resize() {
      const { clientWidth: w, clientHeight: h } = stage;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // keep the whole cat in frame on narrow or short stages
      camera.position.setLength(Math.max(5.2, 5.2 * 0.7 / camera.aspect));
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    if (reduceMotion.matches) controls.autoRotate = false;

    // Fade the floor shadow as the view tilts away from eye level, so it never
    // shows as a flat disc from above or a floating smudge from below.
    const restPolar = controls.getPolarAngle();
    const smoothstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

    renderer.setAnimationLoop(() => {
      controls.update();
      const tilt = controls.getPolarAngle() - restPolar;
      shadow.material.opacity = 1 - smoothstep(0.03, tilt < 0 ? 0.3 : 0.12, Math.abs(tilt));
      shadow.visible = shadow.material.opacity > 0.01;

      // drop the glasses in from above (or lift them off) with a slight settle
      const target = glassesOn ? 1 : 0;
      glassesT += (target - glassesT) * (reduceMotion.matches ? 1 : 0.12);
      if (Math.abs(target - glassesT) < 0.001) glassesT = target;
      glasses.visible = glassesT > 0;
      glasses.position.y = (1 - glassesT) * 0.45;
      const fade = Math.min(glassesT * 1.6, 1);
      for (const m of glassesMaterials) {
        m.opacity = m.userData.baseOpacity * fade;
        const transparent = m.userData.baseOpacity < 1 || fade < 1;
        if (m.transparent !== transparent) { m.transparent = transparent; m.needsUpdate = true; }
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
